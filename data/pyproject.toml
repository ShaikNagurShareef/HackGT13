[project]
name = "pathpulse-data"
version = "0.1.0"
description = "PathPulse data pipeline: ingest crashes, build network, train and export the risk model"
requires-python = ">=3.12"
dependencies = [
  "osmnx>=2.1",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.7",
  "pandas>=2.2",
  "pyarrow>=18",
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "statsmodels>=0.14",
  "optuna>=4.1",
  "h3>=4.1",
  "astral>=3.2",
  "httpx>=0.28",
  "tenacity>=9.0",
  "pydantic>=2.9",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathpulse_data"]

[tool.coverage.run]
source = ["pathpulse_data"]
omit = [
  "*/fetch/*",
  "*/db/*",
  "*/__main__.py",
  "*/cli.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
