  <body>
    <div id="root">
      <main class="app status-screen" aria-busy="true">
        <div class="status-card">
          <img src="/favicon.svg" width="44" height="44" alt="" />
          <h1 class="status-brand">PathPro</h1>
          <p class="status-tagline">See the risks on your way, before you go.</p>
          <p>Pedestrian traffic-risk forecasts for every Atlanta street, by hour and weather, and lower-risk walking routes.</p>
          <p role="status">Loading the traffic-risk map…</p>
        </div>
      </main>
    </div>
    <noscript>
      <p style="padding: 16px; color: #e8f1f7; text-align: center">PathPro needs JavaScript to draw the Atlanta traffic-risk map. Please turn it on and reload.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
