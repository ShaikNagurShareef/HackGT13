[project]
name = "pathpulse-backend"
version = "0.1.0"
description = "PathPro API: routes, segment detail, explanations, live conditions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "numpy>=2.0",
  "scipy>=1.14",
  "h3>=4.1",
  "httpx>=0.28",
  "orjson>=3.10",
  "cachetools>=5.5",
  "astral>=3.2",
  "tzdata>=2024.2",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pymongo>=4.10",
  "certifi>=2024.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
show_missing = true
